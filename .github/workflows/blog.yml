name: Daily blog post

# No schedule here: an external cron (cron-job.org) triggers this through the GitHub API once a day.
# It can also be run by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Caches the small local embedding model used to avoid duplicate topics.
      - uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-embed-model-v1

      - name: Generate post
        id: generate
        run: npm run blog:generate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }} # optional: more keys, comma separated
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }} # optional: more keys, comma separated
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-check every post against the rules
        run: npm run blog:check

      - name: Commit the new post
        id: commit
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add content/blog public/blog
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "blog: add daily post"
            # main may have moved while the post was being written, so rebase onto it before pushing
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Vercel can skip deployments for commits by a bot author, so start the deploy explicitly.
      - name: Trigger a Vercel deploy
        if: steps.commit.outputs.committed == 'true'
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set, skipping"
          else
            curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

      # A failed gate publishes nothing and opens an issue with the draft and the reasons.
      - name: Open an issue if no post was published
        if: failure() && steps.generate.outcome == 'failure'
        run: gh issue create --title "Daily blog post was not published ($(date -u +%F))" --body-file blog-failure.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
